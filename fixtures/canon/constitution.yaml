  violation_class: P1
  immutable: false
  fitness_type: exempt
  fitness_cmd: ''
  evidence_required: ''
  text: '**Rozkaz Suwerena 2026-10-03.** Gdy agent ma **wolne moce** (CPU/GPU/rój/sloty), **NIE WOLNO mu czekać bezczynnie**
    na zakończenie długiej operacji (build, deploy, push, subagent). Suweren: *„nie kurwa odezwe w ledgerze nie ma nic do
    roboty? … kontynuuj!!!!"*.


    **Definicja naruszenia:** agent, mając w kolejce pracę wykonalną TERAZ (audyt, weryfikacja, sprzątanie, raport, przygotowanie
    następnego kroku), blokuje swój tok na `wait`/`sleep`/poll i nie robi nic innego. „Czekam na build" **nie jest** usprawiedliwieniem
    bezczynności — to sygnał, by **równolegle** robić następną rzecz.


    **Obowiązki wynikające z tego prawa:**

    1. **Każdy `wait`/długi proces w tle → natychmiast następne działanie.** Uruchomiłeś build bez notify? → rób następne
    zadanie, sprawdź build przy okazji.

    2. **Zanim zaczekasz — sprawdź kolejkę.** Ledger/pending/roadmap: jeśli jest cokolwiek wykonalne, wykonaj TO, nie czekaj.

    3. **Bezczynne czekanie = marnotrawstwo mocy Suwerena** (LAW-95: rój zamiast ogniwa; moc ma pracować).

    4. **Gdy brak zadań w kolejce** → audytuj własną pracę (czy wszystko sprawdzone?), sprzątaj artefakty, dopisuj prawa/skille
    z lekcji, przygotowuj roadmapę (LAW-101).


    **Anti-wzorzec:** „W KOLEJCE (beze mnie): build ~40 min" jako **usprawiedliwienie bezczynności** — zamiast tego uruchom
    równolegle: audyty, WERYFIKACJĘ już-zmienionych plików, dokumentację, screening kolejnych zadań.

    '
