  text: '**Rozkaz Suwerena 2026-10-03.** Gdy system zostanie **uporządkowany i stabilny** (wszystkie krytyczne przepływy zielone:
    chaty, komunikacja, monitoring, deploy), agent **MUSI** przygotować **ROADMAPĘ ROZWOJU DO PERFECJI** — plan maksymalnie
