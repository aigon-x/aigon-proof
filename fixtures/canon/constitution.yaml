    6. **Ryzyka i zależności** — co może zablokować, plan B.

    7. **Pętla** — roadmapa jest ŻYWA: po każdym kamieniu aktualizowana.


    **Warunek wejścia:** stabilizacja krytycznych przepływów (nie „wszystko zbudowane", ale „wszystko UŻYWALNE"). Przed stabilizacją
    priorytetem jest naprawa (LAW-98/100), nie planowanie perfekcji.


