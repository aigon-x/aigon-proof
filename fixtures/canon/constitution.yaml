- id: LAW-98
  layer: l8
  name: Bounded I/O Under Lock (Żaden Tick Nie Czeka Na I/O Bez Timeoutu)
  violation_class: P2
  immutable: false
  fitness_type: enforcer+asset
  fitness_cmd: tools/gates/runtime-lock-discipline.sh
  evidence_required: tools/gates/runtime-lock-discipline.sh
  text: '**Żadna operacja na write locku ani żaden etap ticka nie może czekać na I/O zewnętrzne (sieć mesh, HTTP, wywołanie
    LLM, DNS, DB, sieciowy system plików) bez z góry ustalonego, twardego timeoutu. Każde `await` na I/O wykonane pod write
    lockiem MUSI mieć deadline; tick/work-unit, który przekroczył swój budżet, PRZERYWA I/O i ZWALNIA lock — nigdy nie czeka
    w nieskończoność.** Brak timeoutu nie jest „brakiem limitu" — jest blokadą całego runtime''u (spójne z LAW-80: puste,
    ale egzekwowane pole = blokada, nie pauza).


    **Zmierzone naruszenie (2026-10-03):** runtime AIGON `tick=0 stage=7` (peer-discovery) trzymał `runtime.write()` **10–18
    s**, bo `join_all(probes)` w ticku **nie miał globalnego timeoutu** (mesh reconnect w pętli). Skutek lawinowy: snapshot
    health nie odświeżał się (WARN ×631), chat czekał na write lock → **HTTP 000**, a `tick_num=0` powodował, że **każdy tick
    wyglądał na „pierwszy"** (blok `is_multiple_of(10)` odpalał się bez końca). To bezpośrednia blokada twarzy systemu wobec
    Suwerena — naruszenie LAW-Ω2 („system nie blokuje").


    **To NIE pierwszy taki przypadek.** Komentarz w kodzie (`crates/aigon-runtime/src/lib.rs:5825`) opisuje identyczny wcześniejszy
    defekt (P0 **2026-08-31**): probe''y peer-discovery były **sekwencyjne** (każdy z 3 s boot-clientem) **wewnątrz write
    locka ticka**; przy kilku niedostępnych peerach jeden tick przekraczał `TICK_MAX_SECS=10` i był abortowany za każdym razem
    — `tick_num` nigdy nie rósł. Wtedy „naprawą" było **zrównoleglenie** probe''ów (1 s discovery client). **2026-10-03 dowodzi,
    że równoległość bez globalnego timeoutu NIE wystarcza** — nadal blokuje lock, gdy pojedynczy probe zawiesi się bez granicy,
    a peerów przybywa. Naprawiono **objaw**, nie **klasę** — co samo w sobie było naruszeniem LAW-97.


    **Zakazy wynikające z tego prawa (każdy grep-owalny albo mierzalny):**

    1. **Zakaz unbounded `await` pod lockiem.** W ścieżce ticka oraz pod `write()`/`Mutex`/`RwLock`-write każdy `.await` na
    I/O zewnętrzne MUSI być owinięty w `tokio::time::timeout` / `Deadline` / równoważny bound. Sieciowy `await` bez timeoutu
    w ticku = naruszenie.

    2. **Timeout globalny dla całego etapu, nie tylko per-operacja.** `join_all` / `FuturesUnordered` na N probe''ach MUSI
    mieć **wspólny deadline całego etapu** — suma per-operacyjnych timeoutów nie chroni, gdy jedna operacja nie kończy się
    nigdy albo liczba peerów rośnie.

    3. **Lock nigdy nie trzymany przez nieograniczone czekanie.** I/O wykonuj PRZED acquire albo PO release; jeżeli musi być
    pod lockiem — wyłącznie z twardym boundem i gwarancją zwolnienia po jego przekroczeniu.

    4. **Budżet ticka jest twardy i widoczny.** `TICK_MAX_SECS` musi być egzekwowany i **alertowany** (metryka: max czas ticka
    + max czas trzymania write locka). Cichy tick przekraczający budżet bez alertu jest tak samo groźny jak deadlock (LAW-4:
    zgubiony sygnał).

    5. **Naprawa klasy, nie egzemplarza.** Miejsce z tym wzorcem naprawia się u źródła, a regresja zostaje wpięta w bramkę
    — żeby ta sama blokada nie wróciła po cichu (LAW-96, LAW-97).


    **Dowód wykonania:** metryka „max czas ticka" oraz „max czas trzymania write locka" w health; każdy tick przekraczający
    budżet jest logowany z numerem etapu i czasem. Brak metryki = brak dowodu = FAIL (LAW-3, LAW-8).

    '
  fitness_desc: 'Bramka `tools/gates/fitness/law-98-bounded-io.sh`: (1) LAW-98 obecne w rejestrze konstytucji (proza → `config/canonical/constitution.generated.yaml`);
    (2) grep po ścieżce ticka/write-locka: `.await` na I/O sieciowym bez `timeout`/`Deadline` w tym samym bloku → FAIL; (3)
    każdy `join_all`/gather w etapie ticka ma nadrzędny timeout / blok budżetu; (4) metryka „max czas ticka" istnieje i jest
    podłączona do alertu (LAW-8: brak metryki = P2). Tick przekraczający `TICK_MAX_SECS` bez alertu albo `await` bez timeoutu
    pod write lockiem → **P0** (blokada chatu zmierzona 2026-10-03: HTTP 000, `tick_num=0`).


