  text: 'Zero tolerancji dla przeciętności. „Działa" nie jest oceną pozytywną. Element jest albo najlepszy w swojej klasie,
    albo nie istnieje.

    '
  fitness_desc: '`grep` po `TODO|FIXME|HACK|good enough|na razie` w kodzie produkcyjnym = 0 trafień poza świadomie oznaczonym
