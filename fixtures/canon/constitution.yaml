    '
- id: LAW-10
  layer: l0
  name: Reversible By Default
  violation_class: P1
  immutable: true
  fitness_type: enforcer+asset
  fitness_cmd: tools/gates/recovery.sh
  evidence_required: tools/gates/recovery.sh
  text: 'Każda decyzja, zmiana i operacja jest domyślnie odwracalna. Jeśli nie może być odwracalna, jest **jawnie oznaczona
    jako nieodwracalna** przed wykonaniem, z podpisem Suwerena. Nieodwracalność jest wyjątkiem, nie domyślnym stanem.

    '
  fitness_desc: 'Skan mutacji stanu → każda zmiana ma mechanizm rollback lub jest oznaczona jako `IRREVERSIBLE`. Zmiana bez
    rollbacku i bez oznaczenia → P1.

    '
- id: LAW-11
