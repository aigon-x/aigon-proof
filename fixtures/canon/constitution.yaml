  violation_class: P1
  immutable: false
  fitness_type: exempt
  fitness_cmd: ''
  evidence_required: ''
  text: '**Rozkaz Suwerena 2026-10-03.** Agent kodujący **NIE przerywa własnej pracy, żeby delegować**. Delegacja jest **RÓWNOLEGŁA**:
    subagent / zadanie na rój startuje w tle, a własny wątek agenta **leci dalej bez pauzy**. Suweren: *„agent kodujący deleguje,
    a nie przerywa swoje — to karygodne"*.


    **Zakazy wynikające z tego prawa (każdy mierzalny):**

    1. **Zakaz pauzy własnego toku na czas delegacji.** Zablokowanie pracy własnej (synchroniczne czekanie na wynik subagenta,
    zatrzymanie iteracji, „zrobię swoje, jak subagent skończy") = naruszenie.

    2. **Zakaz serializacji nowego zadania przez zajętego rodzica.** Jeśli rój ma wolne moce, nowe zadanie idzie **na rój**
