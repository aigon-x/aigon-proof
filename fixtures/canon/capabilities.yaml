- name: ops:platform-power
  backend: ops
  enabled: true
  description: 'Dynamiczne zarządzanie ciepłem hosta. Skrypt /opt/PROD/scripts/platform-power.sh: gdy GPU>=90 albo tlimit<0
    albo CPU>=98 — wentylatory lenovo_wmi_other na fanN_max i zejście profilu o stopień (performance→balanced→power-saver).
    Chłód (CPU<=88 i GPU<=80) oddaje desired i EC (fan target 0). Span OTLP platform.power + metryki platform.* → Tempo :43220
    i kolektor :44318/:9464. POST action=status|enforce|set|runtime-tick. max-power odmówione. Kontener runtime bez /sys nie
    udaje zapisu (applied_now=false); egzekucja fanów jest root na hoście.'
