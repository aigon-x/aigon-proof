  description: 'Google Play Publisher dla wszystkich rodzin SZAMANI AI: rejestr, SHA APK, walidacja AAB, odczyt subskrypcji i torow, autoryzowane wyslanie internal. KIEDY: wydania Android i zarzadzanie Play. Lokalnie sprawdzone; rejestracja Google i OAuth niepotwierdzone. Bez publikacji production.'
