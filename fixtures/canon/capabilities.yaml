- name: re
  backend: ops
  enabled: true
  description: 'AIGONX RE-INTEL — Reverse Engineering Intelligence: triage/rozpoznanie artefaktów (AIGONX-RE-01), analiza
    formatu ELF/PE/Mach-O/RAW (AIGONX-RE-02), disassembly+CFG+call graph (AIGONX-RE-03), dekompilacja+IR (AIGONX-RE-04), data
