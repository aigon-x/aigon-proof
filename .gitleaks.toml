# Include the built-in provider/generic credential rules.
[extend]
useDefault = true

# Deliberate non-credentials in this repository. Each entry is scoped: a value
# that appears only in a fixture whose purpose is to prove that the detector
# fires on credential-shaped input.
[allowlist]
description = "Test fixtures: redaction canary and LAW-53/56 negative-test input"
regexes = [
  '''sk-canary-obs02-[0-9a-f]+''',
  '''BogusCredential881''',
]
paths = [
  '''gates/test_m4_fitness_safety_secret_negative\.sh''',
]
