[package]
name = "aigon-governance-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "MCP server exposing the AIGON constitution, gate catalogue and measured perfection"
license = "MIT"
repository = "https://github.com/aigon-x/aigon-proof"
homepage = "https://github.com/aigon-x/aigon-proof"
readme = "README.md"
keywords = ["mcp", "ai-agents", "authorization", "audit", "human-in-the-loop"]
categories = ["development-tools", "authentication"]

[dependencies]
anyhow = "1"
axum = "0.8"
rmcp = { version = "3.6", features = ["server", "transport-io", "transport-streamable-http-server", "macros", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
getrandom = "0.2"
fastembed = { version = "7.1", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
walkdir = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "time", "io-util"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["http-proto", "trace"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[workspace]
